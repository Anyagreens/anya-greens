<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#214b35">
  <meta name="description" content="Connect with Anya Greens on Instagram, YouTube and Facebook.">
  <title>Anya Greens | Connect With Us</title>
  <style>
    :root {
      --forest: #214b35;
      --leaf: #356b49;
      --sage: #dce8d8;
      --cream: #f8f7ef;
      --ink: #23352a;
      --muted: #617064;
      --white: #fffef9;
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 28px 16px;
      display: grid;
      place-items: center;
      color: var(--ink);
      background:
        radial-gradient(ellipse at 10% 5%, rgba(176, 204, 160, .48), transparent 34%),
        radial-gradient(ellipse at 95% 95%, rgba(203, 219, 185, .58), transparent 35%),
        var(--cream);
      font-family: "Avenir Next", Avenir, "Segoe UI", sans-serif;
    }
    .page { width: 100%; max-width: 440px; }
    .card {
      position: relative;
      overflow: hidden;
      padding: 34px 26px 28px;
      border: 1px solid rgba(33, 75, 53, .14);
      border-radius: 28px;
      background: rgba(255, 254, 249, .93);
      box-shadow: 0 18px 55px rgba(36, 64, 43, .10);
      text-align: center;
    }
    .leaf-art {
      width: 92px; height: 92px;
      margin: 0 auto 18px;
      display: grid; place-items: center;
      border-radius: 50%;
      color: #f8f7ef;
      background: var(--forest);
      box-shadow: 0 0 0 8px #e9efe3, 0 0 0 9px rgba(33,75,53,.08);
    }
    .leaf-art svg { width: 53px; height: 53px; }
    .eyebrow {
      margin: 0 0 7px;
      color: var(--leaf);
      font-size: 11px;
      font-weight: 750;
      letter-spacing: .22em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      color: var(--forest);
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(36px, 9vw, 45px);
      font-weight: 500;
      letter-spacing: -.045em;
      line-height: 1.05;
    }
    .intro {
      max-width: 290px;
      margin: 14px auto 25px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.7;
    }
    .links { display: grid; gap: 12px; }
    .social-link {
      min-height: 56px;
      padding: 0 17px;
      display: flex;
      align-items: center;
      gap: 13px;
      border: 1px solid rgba(33,75,53,.13);
      border-radius: 15px;
      background: #fff;
      color: var(--forest);
      text-decoration: none;
      text-align: left;
      transition: transform .18s ease, box-shadow .18s ease, background .18s ease;
    }
    .social-link:hover, .social-link:focus-visible {
      transform: translateY(-2px);
      background: #f7faf4;
      box-shadow: 0 8px 20px rgba(33,75,53,.09);
      outline: 2px solid #9fbea0;
      outline-offset: 2px;
    }
    .social-icon {
      width: 35px; height: 35px; flex: 0 0 35px;
      display: grid; place-items: center;
      border-radius: 11px;
      background: var(--sage);
      color: var(--forest);
    }
    .social-icon svg { width: 20px; height: 20px; }
    .link-label { flex: 1; font-size: 15px; font-weight: 700; }
    .link-sub { display: block; margin-top: 2px; color: var(--muted); font-size: 11px; font-weight: 450; }
    .arrow { color: #78917d; font-size: 22px; line-height: 1; }
    .footer {
      margin: 24px 0 0;
      color: #778477;
      font-size: 10px;
      letter-spacing: .13em;
      text-transform: uppercase;
    }
    .footer span { padding: 0 6px; color: #a4b29f; }
    @media (max-width: 360px) {
      .card { padding: 30px 18px 24px; border-radius: 23px; }
      .intro { font-size: 13px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="card" aria-labelledby="brand-name">
      <div class="leaf-art" aria-hidden="true">
        <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M51 10C32 10 17 17 14 32c-2 10 5 17 14 15 15-3 22-18 23-37Z" fill="#BFD5B8"/>
          <path d="M11 54c9-17 19-25 32-34" stroke="#F8F7EF" stroke-width="2.5" stroke-linecap="round"/>
          <path d="M29 37c-1-7-5-11-11-13M36 29c6 0 10 2 13 6" stroke="#F8F7EF" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </div>
      <p class="eyebrow">Grow with us</p>
      <h1 id="brand-name">Anya Greens</h1>
      <p class="intro">A little more green in your everyday. Follow along and connect with us on your favourite platform.</p>

      <nav class="links" aria-label="Anya Greens social media">
        <a class="social-link" href="https://www.instagram.com/anya.greens?utm_source=ig_web_button_share_sheet&amp;dlrf=ZDNlZDc0MzIxNw==" target="_blank" rel="noopener noreferrer">
          <span class="social-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3.2" y="3.2" width="17.6" height="17.6" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.7" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>
          </span>
          <span class="link-label">Instagram<span class="link-sub">Follow our latest updates</span></span>
          <span class="arrow" aria-hidden="true">›</span>
        </a>
        <a class="social-link" href="https://youtube.com/@anya.greens?si=wGWSpmao52dcN2sJ" target="_blank" rel="noopener noreferrer">
          <span class="social-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="2.5" y="5" width="19" height="14" rx="4"/><path d="m10 9 5 3-5 3Z" fill="currentColor" stroke="none"/></svg>
          </span>
          <span class="link-label">YouTube<span class="link-sub">Watch and explore</span></span>
          <span class="arrow" aria-hidden="true">›</span>
        </a>
        <a class="social-link" href="https://www.facebook.com/share/1DoyQvDWVm/" target="_blank" rel="noopener noreferrer">
          <span class="social-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M13.6 21v-8.2h2.8l.4-3.2h-3.2V7.5c0-.9.3-1.6 1.6-1.6H17V3.1c-.8-.1-1.7-.2-2.7-.2-2.7 0-4.5 1.6-4.5 4.7v2H7v3.2h2.8V21h3.8Z"/></svg>
          </span>
          <span class="link-label">Facebook<span class="link-sub">Stay connected with us</span></span>
          <span class="arrow" aria-hidden="true">›</span>
        </a>
      </nav>
      <p class="footer">Rooted in nature <span>•</span> Made to grow</p>
    </section>
  </main>
</body>
</html>
